<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebbProjekt1</title>

    <!-- Leaflet CSS (för kartan) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Din egen CSS -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="card">
    <h1 th:text="${message}">
        Welcome to WebbProjekt1!
    </h1>

    <p>
        This Spring Boot app uses Thymeleaf to render the home page.
    </p>

    <p class="meta">
        Server time:
        <span th:text="${currentTime}">
            2026-05-11T12:00:00
        </span>
    </p>

    <!-- Nytt: Karta -->
    <hr />
    <h2>Karta</h2>
    <input type="text" id="stad" placeholder="Ange stad" />
    <button onclick="hamtaEvenemang()">Sök</button>
    <div id="karta" style="height: 400px;"></div>
</div>

<!-- Leaflet JavaScript (för kartan) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Din egen JavaScript -->
<script th:src="@{/script.js}"></script>

</body>
</html>
